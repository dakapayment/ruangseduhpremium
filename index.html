      const [adminMenuModal, setAdminMenuModal] = useState({ open: false, item: null });
      const [adminPromoModal, setAdminPromoModal] = useState({ open: false, item: null });
      const [adminRewardModal, setAdminRewardModal] = useState({ open: false, item: null });
      const [adminMemberModal, setAdminMemberModal] = useState(false);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('rs_current_user', JSON.stringify(currentUser));
          setMembersList(prev => {
            const updated = prev.map(m => m.id === currentUser.id ? currentUser : m);
            localStorage.setItem('rs_members_list', JSON.stringify(updated));
            return updated;
          });
        } else {
          localStorage.removeItem('rs_current_user');
        }
      }, [currentUser]);

      useEffect(() => {
        localStorage.setItem('rs_members_list', JSON.stringify(membersList));
      }, [membersList]);

      useEffect(() => {
        localStorage.setItem('rs_rewards', JSON.stringify(rewardsList));
      }, [rewardsList]);

      useEffect(() => {
        localStorage.setItem('rs_promos', JSON.stringify(promos));
      }, [promos]);

      const handleLogoClick = () => {
        if (activeRole === 'admin') return;
        const nextCount = logoClicks + 1;
        setLogoClicks(nextCount);
        if (clickTimerRef.current) clearTimeout(clickTimerRef.current);

        if (nextCount >= 5) {
          setActiveRole('admin');
          setLogoClicks(0);
          showToast('Mode Admin Rahasia Berhasil Diaktifkan! 🔐', 'success');
        } else {
          if (nextCount >= 3) {
            showToast(`Klik ${5 - nextCount}x lagi untuk masuk Admin...`, 'error');
          }
          clickTimerRef.current = setTimeout(() => { setLogoClicks(0); }, 2500);
        }
      };

      const showToast = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 3500);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const phone = formData.get('phone').trim();
        const name = formData.get('name').trim();

        if (!phone || !name) {
          showToast('Mohon isi Nomor HP dan Nama Anda!', 'error');
          return;
        }

        let existingMember = membersList.find(m => m.phone === phone);

        if (existingMember) {
          const updatedMember = { ...existingMember, name };
          setCurrentUser(updatedMember);
          showToast(`Selamat datang kembali, ${name}! 👋`);
        } else {
          const newMember = {
            id: `u_${Date.now()}`,
            name,
            phone,
            email: `${phone}@ruangseduh.com`,
            points: 100,
            claimedQRs: [],
            myVouchers: [
              { id: `v_welcome_${Date.now()}`, name: 'Voucher Selamat Datang Rp 15.000', code: 'WELCOME15', discountAmount: 15000, type: 'fixed' }
            ]
          };
          setMembersList(prev => [...prev, newMember]);
          setCurrentUser(newMember);
          showToast(`Akun member baru atas nama "${name}" berhasil dibuat! 🎉`);
        }

        setIsLoginModalOpen(false);
        if (pendingCheckout) {
          setPendingCheckout(false);
          setIsCartOpen(true);
          setCheckoutStep('payment');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setSelectedVoucher(null);
        showToast('Anda telah berhasil keluar dari akun.');
      };

      const memberLevel = useMemo(() => {
        const pts = currentUser ? currentUser.points : 0;
        if (pts >= 1000) return { name: 'Platinum', badge: 'bg-yellow-500 text-slate-900', color: 'from-amber-200 via-yellow-400 to-amber-600' };
        if (pts >= 500) return { name: 'Gold', badge: 'bg-amber-500 text-white', color: 'from-amber-400 to-yellow-600' };
        return { name: 'Silver', badge: 'bg-slate-400 text-white', color: 'from-slate-300 to-slate-400' };
      }, [currentUser]);

      const handleOpenDetail = (product) => {
        setSelectedProduct(product);
        setSugarLevel('Normal Sugar');
        setOrderNotes('');
      };

      const handleAddToCart = () => {
        if (!selectedProduct) return;
        const cartItem = {
          cartItemId: Date.now().toString(),
          productId: selectedProduct.id,
          name: selectedProduct.name,
          price: selectedProduct.price,
          image: selectedProduct.image,
          sugarLevel: sugarLevel,
          notes: orderNotes,
          qty: 1
        };

        setCart((prev) => {
          const existingIdx = prev.findIndex(
            i => i.productId === cartItem.productId && i.sugarLevel === cartItem.sugarLevel && i.notes === cartItem.notes
          );
          if (existingIdx > -1) {
            const updated = [...prev];
            updated[existingIdx].qty += 1;
            return updated;
          }
          return [...prev, cartItem];
        });

        setSelectedProduct(null);
        showToast(`"${selectedProduct.name}" ditambahkan ke keranjang!`);
      };

      const updateCartQty = (cartItemId, delta) => {
        setCart((prev) => prev.map(item => {
          if (item.cartItemId === cartItemId) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const totalCartCount = useMemo(() => cart.reduce((sum, item) => sum + item.qty, 0), [cart]);

      const subtotalCart = useMemo(() => {
        return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      }, [cart]);

      const discountAmount = useMemo(() => {
        if (!selectedVoucher) return 0;
        if (selectedVoucher.type === 'percent' || selectedVoucher.discountPercent) {
          return Math.round((subtotalCart * (selectedVoucher.discountPercent || 0)) / 100);
        }
        return selectedVoucher.discountAmount || 0;
      }, [selectedVoucher, subtotalCart]);

      const finalTotalAmount = useMemo(() => {
        return Math.max(0, subtotalCart - discountAmount);
      }, [subtotalCart, discountAmount]);

      const sendTelegramNotification = async (order) => {
        if (!TELEGRAM_TOKEN || !TELEGRAM_CHAT_ID) return;

        const itemsText = order.items.map(item => (
          `• *${item.qty}x ${item.name}*\n  _Gula: ${item.sugarLevel}_${item.notes ? `\n  _Catatan: ${item.notes}_` : ''}`
        )).join('\n');

        const message = `🚨 *PESANAN BARU RUANG SEDUH!* ☕\n\n` +
          `*No. Pesanan:* \`${order.orderNo}\`\n` +
          `*Nama:* ${order.customerName}\n` +
          `*No. HP:* ${order.customerPhone}\n` +
          `*Metode Bayar:* ${order.paymentMethod}\n\n` +
          `*Detail Minuman:*\n${itemsText}\n\n` +
          `-----------------------------------\n` +
          `*Subtotal:* Rp ${order.subtotal.toLocaleString('id-ID')}\n` +
          (order.discountAmount > 0 ? `*Diskon:* -Rp ${order.discountAmount.toLocaleString('id-ID')} (${order.appliedVoucher})\n` : '') +
          `*TOTAL:* *Rp ${order.totalAmount.toLocaleString('id-ID')}*\n` +
          `-----------------------------------\n` +
          `📌 *Status:* ${order.status}`;

        try {
          await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN.trim()}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID.trim(),
              text: message,
              parse_mode: 'Markdown'
            })
          });
        } catch (error) {
          console.error("Gagal mengirimkan notifikasi Telegram:", error);
        }
      };

      const sendToGoogleSheets = async (order) => {
        if (!APPS_SCRIPT_URL.trim()) return;

        const payload = {
          orderNo: order.orderNo,
          createdAt: new Date(order.createdAt).toLocaleString('id-ID'),
          customerName: order.customerName,
          customerPhone: order.customerPhone,
          items: order.items.map(i => `${i.qty}x ${i.name} (${i.sugarLevel})`).join('; '),
          paymentMethod: order.paymentMethod,
          subtotal: order.subtotal,
          discountAmount: order.discountAmount,
          totalAmount: order.totalAmount,
          status: order.status
        };

        try {
          await fetch(APPS_SCRIPT_URL.trim(), {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } catch (e) {
          console.error("Gagal sinkronisasi Google Sheets:", e);
        }
      };

      const handleApplyPromoCode = () => {
        if (!promoInput.trim()) {
          showToast('Masukkan kode promo terlebih dahulu', 'error');
          return;
        }
        const codeUpper = promoInput.trim().toUpperCase();
        const matchedPromo = promos.find(p => p.code.toUpperCase() === codeUpper);

        if (matchedPromo) {
          const promoVoucher = {
            id: `promo_${Date.now()}`,
            name: matchedPromo.title,
            code: matchedPromo.code,
            discountAmount: matchedPromo.discountAmount || 0,
            discountPercent: matchedPromo.discountPercent || 0,
            type: matchedPromo.type || (matchedPromo.discountPercent ? 'percent' : 'fixed')
          };
          setSelectedVoucher(promoVoucher);
          setShowVoucherSelector(false);
          setPromoInput('');
          showToast(`Voucher "${matchedPromo.title}" berhasil dipasang! 🎉`);
        } else {
          showToast('Kode promo tidak ditemukan / tidak valid', 'error');
        }
      };

      const handleProcessCheckout = async () => {
        if (cart.length === 0) return;

        if (!currentUser) {
          setIsCartOpen(false);
          setPendingCheckout(true);
          setIsLoginModalOpen(true);
          showToast('Silakan login / mendaftar terlebih dahulu untuk melanjutkan checkout', 'error');
          return;
        }

        const orderNo = `RS-${Math.floor(100000 + Math.random() * 900000)}`;
        const qrReceiptCode = `QR-POINT-${orderNo}-${Date.now().toString().slice(-4)}`;
        const potentialPoints = Math.floor(finalTotalAmount / 1000);

        const newOrder = {
          orderNo,
          customerName: currentUser.name,
          customerPhone: currentUser.phone,
          items: cart,
          subtotal: subtotalCart,
          discountAmount: discountAmount,
          appliedVoucher: selectedVoucher ? selectedVoucher.name : null,
          totalAmount: finalTotalAmount,
          paymentMethod: 'Bayar di Kasir',
          status: 'Menunggu Konfirmasi',
          createdAt: new Date().toISOString(),
          qrReceiptCode,
          pointsEarned: potentialPoints,
          qrClaimed: false
        };

        sendTelegramNotification(newOrder);
        sendToGoogleSheets(newOrder);

        if (selectedVoucher && selectedVoucher.id) {
          setCurrentUser(prev => ({
            ...prev,
            myVouchers: prev.myVouchers.filter(v => v.id !== selectedVoucher.id)
          }));
        }

        setOrders((prev) => [newOrder, ...prev]);
        setActiveOrderReceipt(newOrder);
        setCart([]);
        setSelectedVoucher(null);
        setIsCartOpen(false);
        setCheckoutStep('cart');
        showToast(`Pesanan ${orderNo} berhasil dibuat! ☕`);
      };

      const handleClaimQR = (qrCodeToScan) => {
        if (!currentUser) {
          setIsLoginModalOpen(true);
          showToast('Silakan login terlebih dahulu untuk klaim poin', 'error');
          return;
        }

        const code = qrCodeToScan || scanQRInput;
        if (!code) {
          showToast('Masukkan kode QR struk terlebih dahulu', 'error');
          return;
        }

        const targetOrderIndex = orders.findIndex(o => o.qrReceiptCode === code);
        if (targetOrderIndex === -1) {
          showToast('Kode QR Struk tidak valid!', 'error');
          return;
        }

        const targetOrder = orders[targetOrderIndex];
        if (targetOrder.qrClaimed || (currentUser.claimedQRs && currentUser.claimedQRs.includes(code))) {
          showToast('Kode QR ini sudah pernah dipindai/hangus!', 'error');
          return;
        }

        const earned = targetOrder.pointsEarned || Math.floor(targetOrder.totalAmount / 1000);
        setCurrentUser(prev => ({
          ...prev,
          points: prev.points + earned,
          claimedQRs: [...(prev.claimedQRs || []), code]
        }));

        const updatedOrders = [...orders];
        updatedOrders[targetOrderIndex].qrClaimed = true;
        setOrders(updatedOrders);

        setScanQRInput('');
        setQrModalOpen(false);
        showToast(`Selamat! +${earned} Poin ditambahkan ke akun Anda. 🎉`);
      };

      const handleRedeemReward = (reward) => {
        if (!currentUser) {
          setIsLoginModalOpen(true);
          showToast('Silakan login terlebih dahulu untuk menukarkan poin', 'error');
          return;
        }

        if (currentUser.points < reward.points) {
          showToast('Poin Anda tidak mencukupi untuk hadiah ini!', 'error');
          return;
        }

        const newVoucher = {
          id: `v_reward_${Date.now()}`,
          name: reward.name,
          code: `RW-${Math.floor(1000 + Math.random() * 9000)}`,
          discountAmount: reward.discountAmount || 15000,
          type: 'fixed'
        };

        setCurrentUser(prev => ({ 
          ...prev, 
          points: prev.points - reward.points,
          myVouchers: (reward.type === 'Voucher Diskon' || reward.type === 'Gratis Minuman') 
            ? [...prev.myVouchers, newVoucher] 
            : prev.myVouchers
        }));

        showToast(`Berhasil menukarkan "${reward.name}"! Voucher langsung tersedia di menu checkout.`);
      };

      const handleAdminAddMember = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const newM = {
          id: `u_admin_${Date.now()}`,
          name: formData.get('name'),
          phone: formData.get('phone'),
          email: formData.get('email') || `${formData.get('phone')}@ruangseduh.com`,
          points: Number(formData.get('points')) || 100,
          claimedQRs: [],
          myVouchers: []
        };
        setMembersList(prev => [...prev, newM]);
        setAdminMemberModal(false);
        showToast(`Member "${newM.name}" berhasil ditambahkan oleh Admin!`);
      };

      const handleAdminDeleteMember = (memberId) => {
        setMembersList(prev => prev.filter(m => m.id !== memberId));
        if (currentUser && currentUser.id === memberId) {
          setCurrentUser(null);
        }
        showToast('Member berhasil dihapus dari database.');
      };

      const filteredDatabaseOrders = useMemo(() => {
        return orders.filter(o => {
          const matchStatus = dbStatusFilter === 'Semua' || o.status === dbStatusFilter;
          let matchDate = true;
          if (dbDateFilter === 'Hari Ini') {
            const today = new Date().toISOString().split('T')[0];
            matchDate = o.createdAt.startsWith(today);
          }
          return matchStatus && matchDate;
        });
      }, [orders, dbStatusFilter, dbDateFilter]);

      const handleExportCSV = () => {
        if (orders.length === 0) {
          showToast('Belum ada data penjualan untuk diekspor', 'error');
          return;
        }
        const headers = "No Pesanan,Tanggal,Pelanggan,No HP,Minuman,Metode Bayar,Subtotal,Diskon,Total,Status\n";
        const rows = orders.map(o => (
          `"${o.orderNo}","${new Date(o.createdAt).toLocaleString('id-ID')}","${o.customerName}","${o.customerPhone}","${o.items?.map(i => `${i.qty}x ${i.name}`).join('; ')}","${o.paymentMethod}",${o.subtotal || o.totalAmount},${o.discountAmount || 0},${o.totalAmount},"${o.status}"`
        )).join("\n");

        const csvContent = "data:text/csv;charset=utf-8," + headers + rows;
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Laporan_Penjualan_RuangSeduh_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showToast('File CSV Laporan Penjualan berhasil diunduh!');
      };

      const handleUpdateOrderStatus = async (orderId, newStatus) => {
        setOrders(prev => prev.map(o => (o.id === orderId || o.orderNo === orderId) ? { ...o, status: newStatus } : o));
        showToast(`Status pesanan diperbarui ke "${newStatus}"`);
      };

      const handleSaveMenuItem = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const newItem = {
          id: adminMenuModal.item ? adminMenuModal.item.id : `m_${Date.now()}`,
          name: formData.get('name'),
          category: formData.get('category'),
          price: Number(formData.get('price')),
          desc: formData.get('desc'),
          image: formData.get('image') || 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=500&q=80'
        };

        if (adminMenuModal.item) {
          setMenuItems(prev => prev.map(i => i.id === newItem.id ? newItem : i));
          showToast('Menu berhasil diperbarui');
        } else {
          setMenuItems(prev => [...prev, newItem]);
          showToast('Menu baru berhasil ditambahkan');
        }
        setAdminMenuModal({ open: false, item: null });
      };

      const handleDeleteMenuItem = (id) => {
        setMenuItems(prev => prev.filter(i => i.id !== id));
        showToast('Menu berhasil dihapus');
      };

      const handleSavePromoItem = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const promoType = formData.get('type');
        const val = Number(formData.get('val'));

        const newPromo = {
          id: adminPromoModal.item ? adminPromoModal.item.id : `p_${Date.now()}`,
          title: formData.get('title'),
          code: formData.get('code').toUpperCase(),
          desc: formData.get('desc'),
          type: promoType,
          discountPercent: promoType === 'percent' ? val : 0,
          discountAmount: promoType === 'fixed' ? val : 0,
          image: formData.get('image') || 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&q=80'
        };

        if (adminPromoModal.item) {
          setPromos(prev => prev.map(p => p.id === newPromo.id ? newPromo : p));
          showToast('Promo berhasil diperbarui');
        } else {
          setPromos(prev => [...prev, newPromo]);
          showToast('Promo baru berhasil ditambahkan');
        }
        setAdminPromoModal({ open: false, item: null });
      };

      const handleDeletePromoItem = (id) => {
        setPromos(prev => prev.filter(p => p.id !== id));
        showToast('Promo berhasil dihapus');
      };

      // Handler CRUD Reward di Admin
      const handleSaveRewardItem = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const newReward = {
          id: adminRewardModal.item ? adminRewardModal.item.id : `r_${Date.now()}`,
          name: formData.get('name'),
          type: formData.get('type'),
          points: Number(formData.get('points')) || 100,
          discountAmount: Number(formData.get('discountAmount')) || 0,
          desc: formData.get('desc')
        };

        if (adminRewardModal.item) {
          setRewardsList(prev => prev.map(r => r.id === newReward.id ? newReward : r));
          showToast('Item reward berhasil diperbarui');
        } else {
          setRewardsList(prev => [...prev, newReward]);
          showToast('Reward baru berhasil ditambahkan');
        }
        setAdminRewardModal({ open: false, item: null });
      };

      const handleDeleteRewardItem = (id) => {
        setRewardsList(prev => prev.filter(r => r.id !== id));
        showToast('Reward berhasil dihapus');
      };

      return (
        <div className={`min-h-screen ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-800'} transition-colors duration-200 font-sans pb-28 md:pb-8 relative`}>
          
          {/* TOAST NOTIFIKASI */}
          {notification && (
            <div className={`fixed top-4 right-4 z-50 flex items-center gap-3 px-5 py-3 rounded-xl shadow-2xl text-white font-medium animate-bounce ${
              notification.type === 'error' ? 'bg-rose-600' : 'bg-[#0B8F5A]'
            }`}>
              <Sparkles className="w-5 h-5 text-amber-300" />
              <span>{notification.message}</span>
            </div>
          )}

          {/* HEADER UTAMA */}
          <header className={`sticky top-0 z-30 backdrop-blur-md border-b ${darkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'} px-4 py-3 shadow-sm`}>
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              
              <div 
                className="flex items-center gap-3 cursor-pointer select-none group" 
                onClick={handleLogoClick}
                title="Ruang Seduh Coffee"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#0B8F5A] to-emerald-400 flex items-center justify-center text-white shadow-md shadow-emerald-900/20 group-active:scale-95 transition">
                  <Coffee className="w-6 h-6 text-amber-200" />
                </div>
                <div>
                  <h1 className="font-extrabold text-xl tracking-tight text-[#0B8F5A] leading-none flex items-center gap-1.5">
                    RUANG SEDUH <span className="text-[10px] bg-amber-500/20 text-amber-600 px-1.5 py-0.5 rounded font-bold uppercase tracking-wider">Premium</span>
                  </h1>
                  <p className="text-[11px] text-slate-400 font-medium tracking-wide">Coffee & Artisanal Brew</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {!currentUser ? (
                  <button
                    onClick={() => setIsLoginModalOpen(true)}
                    className="bg-[#0B8F5A] hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow transition"
                  >
                    <LogIn className="w-4 h-4 text-amber-300" />
                    <span>Login / Daftar</span>
                  </button>
                ) : (
                  <div className="hidden sm:flex items-center gap-2 bg-emerald-50 dark:bg-emerald-950/60 px-3 py-1.5 rounded-xl border border-emerald-200 dark:border-emerald-800">
                    <User className="w-4 h-4 text-[#0B8F5A]" />
                    <span className="text-xs font-bold text-[#0B8F5A]">{currentUser.name}</span>
                  </div>
                )}

                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className={`p-2.5 rounded-xl border transition ${darkMode ? 'bg-slate-800 border-slate-700 text-amber-400' : 'bg-slate-100 border-slate-200 text-slate-600'}`}
                  title="Ganti Tema"
                >
                  {darkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                </button>

                {activeRole === 'admin' && (
                  <button
                    onClick={() => { setActiveRole('customer'); showToast('Kembali ke Mode Pelanggan'); }}
                    className="bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow transition"
                  >
                    <LogOut className="w-4 h-4" />
                    <span className="hidden sm:inline">Keluar Admin</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* KONTEN UTAMA */}
          <main className="max-w-6xl mx-auto px-4 pt-4">

            {/* VIEW PELANGGAN */}
            {activeRole === 'customer' && (
              <div>
                <nav className="hidden md:flex items-center justify-between bg-white dark:bg-slate-900 p-2 rounded-2xl border border-slate-200 dark:border-slate-800 mb-6 shadow-sm">
                  <div className="flex gap-1">
                    {[
                      { id: 'home', label: 'Beranda', icon: Coffee },
                      { id: 'menu', label: 'Menu Minuman', icon: ShoppingBag },
                      { id: 'reward', label: 'Promo & Reward', icon: Gift },
                      { id: 'orders', label: 'Pesanan Saya', icon: Clock },
                      { id: 'profile', label: 'Profil Member', icon: User }
                    ].map(tab => {
                      const Icon = tab.icon;
                      return (
                        <button
                          key={tab.id}
                          onClick={() => setCurrentTab(tab.id)}

                          </div>
                          <div className="flex items-center gap-1.5">
                            <button onClick={() => updateCartQty(item.cartItemId, -1)} className="p-1 bg-slate-200 dark:bg-slate-700 rounded"><Minus className="w-3.5 h-3.5" /></button>
                            <span className="text-xs font-bold px-1">{item.qty}</span>
                            <button onClick={() => updateCartQty(item.cartItemId, 1)} className="p-1 bg-slate-200 dark:bg-slate-700 rounded"><Plus className="w-3.5 h-3.5" /></button>
                          </div>
                        </div>
                      ))
                    )
                  ) : (
                    <div className="space-y-4">
                      {/* Pilihan Voucher saat Checkout */}
                      <div className="bg-amber-500/10 border border-amber-500/30 p-3 rounded-2xl space-y-2">
                        <div className="flex justify-between items-center text-xs font-bold text-amber-600">
                          <span>Voucher & Promo</span>
                          <button onClick={() => setShowVoucherSelector(!showVoucherSelector)} className="text-[#0B8F5A]">Pilih / Masukkan Kode</button>
                        </div>
                        {selectedVoucher ? (
                          <p className="text-xs font-bold text-slate-800 dark:text-slate-200">{selectedVoucher.name} (-Rp {discountAmount.toLocaleString('id-ID')})</p>
                        ) : (
                          <p className="text-[11px] text-slate-400">Belum ada voucher dipasang.</p>
                        )}
                        {showVoucherSelector && (
                          <div className="space-y-2 pt-2 border-t border-amber-200 dark:border-amber-800/50">
                            <div className="flex gap-2">
                              <input 
                                type="text"
                                value={promoInput}
                                onChange={(e) => setPromoInput(e.target.value)}
                                placeholder="KODE PROMO (Cth: GOLD20)"
                                className="flex-1 bg-white dark:bg-slate-800 border p-2 rounded-xl text-xs font-mono uppercase"
                              />
                              <button onClick={handleApplyPromoCode} className="bg-slate-900 text-amber-400 font-bold text-xs px-3 rounded-xl">Pakai</button>
                            </div>
                            <div className="space-y-1">
                              {currentUser && currentUser.myVouchers && currentUser.myVouchers.map(v => (
                                <div key={v.id} onClick={() => { setSelectedVoucher(v); setShowVoucherSelector(false); }} className="p-2 bg-white dark:bg-slate-800 rounded-xl text-xs font-bold cursor-pointer flex justify-between border">
                                  <span>{v.name}</span>
                                  <span className="text-[#0B8F5A]">Pilih</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>

                      {/* INFORMASI PEMBAYARAN KASIR */}
                      <div className="space-y-2">
                        <label className="text-xs font-bold block uppercase tracking-wider text-slate-500">Metode Pembayaran</label>
                        <div className="p-3.5 rounded-2xl border bg-emerald-50 dark:bg-emerald-950/40 border-[#0B8F5A] text-[#0B8F5A] flex items-center justify-between">
                          <div className="flex items-center gap-2.5">
                            <Store className="w-5 h-5 text-[#0B8F5A]" />
                            <div>
                              <span className="text-xs font-bold block">Bayar di Kasir</span>
                              <span className="text-[10px] text-slate-500 dark:text-slate-400">Bayar Tunai / QRIS saat mengambil pesanan</span>
                            </div>
                          </div>
                          <Check className="w-5 h-5 text-[#0B8F5A]" />
                        </div>
                      </div>

                      {/* RINCIAN HARGA PEMBAYARAN */}
                      <div className="p-4 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-slate-500 block mb-1">Rincian Harga</span>
                        
                        <div className="flex justify-between items-center text-xs font-medium">
                          <span className="text-slate-600 dark:text-slate-400">Harga Total (Subtotal)</span>
                          <span className="font-bold">Rp {subtotalCart.toLocaleString('id-ID')}</span>
                        </div>

                        {discountAmount > 0 && (
                          <div className="flex justify-between items-center text-xs font-medium text-emerald-600 dark:text-emerald-400">
                            <span>Potongan Diskon ({selectedVoucher?.name})</span>
                            <span className="font-bold">-Rp {discountAmount.toLocaleString('id-ID')}</span>
                          </div>
                        )}

                        <div className="border-t border-slate-200 dark:border-slate-700 pt-2 flex justify-between items-center">
                          <span className="text-xs font-bold text-slate-800 dark:text-slate-100">Total yang Harus Dibayar</span>
                          <span className="text-xl font-black text-[#0B8F5A]">Rp {finalTotalAmount.toLocaleString('id-ID')}</span>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-4 border-t border-slate-100 dark:border-slate-800 space-y-2">
                    {checkoutStep === 'cart' ? (
                      <button onClick={() => setCheckoutStep('payment')} className="w-full bg-[#0B8F5A] text-white py-3.5 rounded-xl font-bold text-sm">Lanjut ke Pembayaran</button>
                    ) : (
                      <button onClick={handleProcessCheckout} className="w-full bg-amber-500 text-slate-900 py-3.5 rounded-xl font-extrabold text-sm">Konfirmasi Pesanan</button>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL DETAIL MINUMAN & OPSI TINGKAT GULA */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full overflow-hidden shadow-2xl">
                <div className="relative h-48">
                  <img src={selectedProduct.image} alt={selectedProduct.name} className="w-full h-full object-cover" />
                  <button onClick={() => setSelectedProduct(null)} className="absolute top-3 right-3 bg-slate-900/70 text-white p-2 rounded-full">
                    <X className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-6 space-y-4">
                  <h3 className="text-xl font-bold">{selectedProduct.name}</h3>
                  <p className="text-xs text-slate-500">{selectedProduct.desc}</p>
                  <div>
                    <label className="text-xs font-bold uppercase block mb-2">Tingkat Gula (Sugar Level)</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['Normal Sugar', 'Low Sugar', 'Extra Sugar'].map(level => (
                        <button
                          key={level}
                          onClick={() => setSugarLevel(level)}
                          className={`py-2 rounded-xl text-xs font-bold border ${sugarLevel === level ? 'bg-[#0B8F5A] text-white' : 'bg-slate-50 dark:bg-slate-800'}`}
                        >
                          {level}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-bold uppercase block mb-1">Catatan Pesanan</label>
                    <textarea
                      value={orderNotes}
                      onChange={(e) => setOrderNotes(e.target.value)}
                      placeholder="Contoh: Es batu sedikit saja..."
                      className="w-full bg-slate-50 dark:bg-slate-800 border p-2.5 rounded-xl text-xs outline-none"
                      rows={2}
                    />
                  </div>
                  <button onClick={handleAddToCart} className="w-full bg-[#0B8F5A] text-white py-3.5 rounded-xl font-bold text-xs shadow">
                    Tambah ke Keranjang • Rp {selectedProduct.price.toLocaleString('id-ID')}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL STRUK DIGITAL & QR KODE POIN */}
          {activeOrderReceipt && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl relative">
                <button onClick={() => setActiveOrderReceipt(null)} className="absolute top-4 right-4 text-slate-400">
                  <X className="w-5 h-5" />
                </button>

                <div className="w-12 h-12 bg-emerald-100 text-[#0B8F5A] rounded-full flex items-center justify-center mx-auto">
                  <Check className="w-6 h-6" />
                </div>

                <h3 className="font-bold text-lg">Struk Digital Pesanan</h3>
                <span className="font-mono font-black text-amber-600 text-xs block">{activeOrderReceipt.orderNo}</span>

                <div className="p-4 bg-white border-2 border-dashed border-slate-300 rounded-2xl mx-auto w-48 h-48 flex flex-col items-center justify-center shadow-inner">
                  <QrCode size={120} className="text-slate-900" />
                  <span className="text-[9px] font-mono font-bold text-slate-500 mt-2 truncate w-full">
                    {activeOrderReceipt.qrReceiptCode}
                  </span>
                </div>

                <p className="text-xs text-slate-500">
                  Pindai QR ini untuk klaim <span className="font-bold text-[#0B8F5A]">+{activeOrderReceipt.pointsEarned} Poin</span>.
                </p>

                <button
                  onClick={() => {
                    handleClaimQR(activeOrderReceipt.qrReceiptCode);
                    setActiveOrderReceipt(null);
                  }}
                  className="w-full bg-amber-500 text-slate-900 font-bold py-3 rounded-xl shadow text-xs flex items-center justify-center gap-2"
                >
                  <QrCode className="w-4 h-4" /> Klaim Poin Struk Ini Now
                </button>
              </div>
            </div>
          )}

          {/* MODAL SCANNER QR MANUAL */}
          {qrModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 text-center shadow-2xl relative">
                <button onClick={() => setQrModalOpen(false)} className="absolute top-4 right-4 text-slate-400">
                  <X className="w-5 h-5" />
                </button>

                <QrCode className="w-10 h-10 text-[#0B8F5A] mx-auto" />
                <h3 className="font-bold text-lg">Scan / Input Kode QR Struk</h3>
                <p className="text-xs text-slate-500">Ketikkan kode QR unik dari struk belanja Anda untuk menambah poin.</p>

                <input
                  type="text"
                  value={scanQRInput}
                  onChange={(e) => setScanQRInput(e.target.value)}
                  placeholder="Contoh: QR-POINT-RS-123456..."
                  className="w-full bg-slate-50 dark:bg-slate-800 border p-3 rounded-xl text-xs font-mono outline-none"
                />

                <button
                  onClick={() => handleClaimQR()}
                  className="w-full bg-[#0B8F5A] text-white font-bold py-3 rounded-xl shadow text-xs"
                >
                  Proses Klaim Poin
                </button>
              </div>
            </div>
          )}

          {/* MODAL ADMIN TAMBAH / EDIT MENU MINUMAN */}
          {adminMenuModal.open && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleSaveMenuItem} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-base">{adminMenuModal.item ? 'Edit Menu' : 'Tambah Menu Baru'}</h3>
                  <button type="button" onClick={() => setAdminMenuModal({ open: false, item: null })} className="text-slate-400"><X className="w-5 h-5" /></button>
                </div>
                <input name="name" defaultValue={adminMenuModal.item?.name || ''} placeholder="Nama Minuman" required className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                <select name="category" defaultValue={adminMenuModal.item?.category || 'Coffee'} className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800">
                  <option value="Coffee">Coffee</option>
                  <option value="Non Coffee">Non Coffee</option>
                  <option value="Fresh Drink">Fresh Drink</option>
                  <option value="Tea Series">Tea Series</option>
                </select>
                <input name="price" type="number" defaultValue={adminMenuModal.item?.price || 30000} placeholder="Harga" required className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                <textarea name="desc" defaultValue={adminMenuModal.item?.desc || ''} placeholder="Deskripsi Singkat" rows={2} className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                <input name="image" defaultValue={adminMenuModal.item?.image || ''} placeholder="URL Foto Produk" className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                <button type="submit" className="w-full bg-[#0B8F5A] text-white py-3 rounded-xl font-bold text-xs shadow">Simpan Menu</button>
              </form>
            </div>
          )}

          {/* MODAL ADMIN TAMBAH / EDIT PROMO */}
          {adminPromoModal.open && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleSavePromoItem} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-base">{adminPromoModal.item ? 'Edit Promo' : 'Tambah Promo Baru'}</h3>
                  <button type="button" onClick={() => setAdminPromoModal({ open: false, item: null })} className="text-slate-400"><X className="w-5 h-5" /></button>
                </div>
                
                <div>
                  <label className="text-[11px] font-bold block mb-1">Judul Promo</label>
                  <input name="title" defaultValue={adminPromoModal.item?.title || ''} placeholder="Contoh: Promo Cashback GoPay" required className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[11px] font-bold block mb-1">Kode Promo</label>
                    <input name="code" defaultValue={adminPromoModal.item?.code || ''} placeholder="GOPAY50" required className="w-full p-2.5 rounded-xl border text-xs font-mono uppercase dark:bg-slate-800" />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1">Tipe Diskon</label>
                    <select name="type" defaultValue={adminPromoModal.item?.type || 'fixed'} className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800">
                      <option value="fixed">Nominal (Rp)</option>
                      <option value="percent">Persentase (%)</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold block mb-1">Nilai Diskon (Nominal Rp atau %)</label>
                  <input name="val" type="number" defaultValue={adminPromoModal.item?.discountAmount || adminPromoModal.item?.discountPercent || 10000} required className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                </div>

                <div>
                  <label className="text-[11px] font-bold block mb-1">Deskripsi Ringkas</label>
                  <textarea name="desc" defaultValue={adminPromoModal.item?.desc || ''} placeholder="Keterangan syarat & ketentuan..." rows={2} className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                </div>

                <div>
                  <label className="text-[11px] font-bold block mb-1">URL Gambar Promo</label>
                  <input name="image" defaultValue={adminPromoModal.item?.image || ''} placeholder="https://..." className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                </div>

                <button type="submit" className="w-full bg-[#0B8F5A] text-white py-3 rounded-xl font-bold text-xs shadow">Simpan Promo</button>
              </form>
            </div>
          )}

          {/* MODAL ADMIN TAMBAH / EDIT REWARD */}
          {adminRewardModal.open && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleSaveRewardItem} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-base">{adminRewardModal.item ? 'Edit Reward' : 'Tambah Reward Baru'}</h3>
                  <button type="button" onClick={() => setAdminRewardModal({ open: false, item: null })} className="text-slate-400"><X className="w-5 h-5" /></button>
                </div>
                
                <div>
                  <label className="text-[11px] font-bold block mb-1">Nama Hadiah / Reward</label>
                  <input name="name" defaultValue={adminRewardModal.item?.name || ''} placeholder="Contoh: Voucher Diskon Rp 20.000" required className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[11px] font-bold block mb-1">Jenis Reward</label>
                    <select name="type" defaultValue={adminRewardModal.item?.type || 'Voucher Diskon'} className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800">
                      <option value="Voucher Diskon">Voucher Diskon</option>
                      <option value="Gratis Minuman">Gratis Minuman</option>
                      <option value="Merchandise">Merchandise</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1">Jumlah Poin Dibutuhkan</label>
                    <input name="points" type="number" defaultValue={adminRewardModal.item?.points || 150} required className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold block mb-1">Besar Potongan Diskon (Rp)</label>
                  <input name="discountAmount" type="number" defaultValue={adminRewardModal.item?.discountAmount || 15000} placeholder="0 jika bukan voucher" className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                </div>

                <div>
                  <label className="text-[11px] font-bold block mb-1">Deskripsi Syarat & Ketentuan</label>
                  <textarea name="desc" defaultValue={adminRewardModal.item?.desc || ''} placeholder="Keterangan syarat penggunaan..." rows={2} className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800" />
                </div>

                <button type="submit" className="w-full bg-[#0B8F5A] text-white py-3 rounded-xl font-bold text-xs shadow">Simpan Reward</button>
              </form>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
